<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TA – RaiseHand Lab.Q</title>
  <link rel="stylesheet" href="styles.css">
  <script src="ta.js" defer></script>
</head>
<body>
  <main class="page page-wide">
    <header class="bar">
      <a class="product" href="./">RaiseHand Lab.Q</a>
      <span class="view-name">TA</span>
    </header>
    <section id="session" class="panel">
      <div id="no-session">
        <h1>Start a lab session</h1>
        <p class="muted">Students join with the code you share, and each session has its own queue.</p>
        <button type="button" id="start">Start session</button>
        <p id="session-error" class="error" role="alert"></p>
      </div>
      <div id="live-session" class="live-session" hidden>
        <div>
          <p class="muted">Session code</p>
          <p id="session-code" class="session-code"></p>
          <p class="muted">Students join with this code.</p>
        </div>
        <button type="button" id="end" class="secondary">End session</button>
      </div>
    </section>
    <section id="queue-panel" class="panel" aria-live="polite">
      <div class="queue-head">
        <h1 id="queue-title">Queue</h1>
      </div>
      <p id="queue-empty" class="muted">No doubts yet. They appear here as students raise them.</p>
      <ol id="queue" class="queue"></ol>
      <p id="queue-error" class="error" role="alert"></p>
    </section>
  </main>
</body>
</html>
