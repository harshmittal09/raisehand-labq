<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student – RaiseHand Lab.Q</title>
  <link rel="stylesheet" href="styles.css">
  <script src="student.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="bar">
      <a class="product" href="./">RaiseHand Lab.Q</a>
      <span class="view-name">Student</span>
    </header>

    <section id="join" class="panel" hidden>
      <h1>Join the lab queue</h1>
      <form id="join-form" class="form" novalidate>
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" maxlength="60">
        <label for="system">System number</label>
        <input id="system" name="system" maxlength="20" placeholder="L3-14" autocomplete="off">
        <p id="join-error" class="error" role="alert"></p>
        <button type="submit">Join</button>
      </form>
    </section>

    <section id="raise" class="panel" hidden>
      <p class="who"><span id="who"></span> <button type="button" id="leave" class="link-button">Not you?</button></p>
      <h1>What's your doubt?</h1>
      <form id="raise-form" class="form" novalidate>
        <fieldset class="chips">
          <legend>What's it about?</legend>
          <label class="chip"><input type="radio" name="category" value="compile-error"> Compile error</label>
          <label class="chip"><input type="radio" name="category" value="logic"> Logic</label>
          <label class="chip"><input type="radio" name="category" value="viva"> Viva prep</label>
          <label class="chip"><input type="radio" name="category" value="other"> Other</label>
        </fieldset>
        <label for="description">Describe it in one line</label>
        <textarea id="description" name="description" maxlength="140" rows="3"></textarea>
        <p class="counter"><span id="count">0</span> / 140</p>
        <p id="raise-error" class="error" role="alert"></p>
        <button type="submit">Raise my hand</button>
      </form>
    </section>

    <section id="status" class="panel" hidden aria-live="polite">
      <h1>You're in the queue</h1>
      <p id="my-doubt" class="my-doubt"></p>
    </section>
  </main>
</body>
</html>
